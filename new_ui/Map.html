<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#57bca5",
                        "primary-dark": "#3da891",
                        "background-light": "#f6f8f7",
                        "background-dark": "#151d1b",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1f2b28",

                    fontFamily: {

<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Almarai', sans-serif;
        }
        .map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .yemen-map path {
            stroke: #ffffff;
            stroke-width: 1;
            transition: all 0.3s ease;
        }
        .yemen-map path:hover {
            filter: brightness(0.9);
            cursor: pointer;
        }
        .tooltip {
            position: absolute;
            background: rgba(31, 43, 40, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 50;
        }
        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: rgba(31, 43, 40, 0.95) transparent transparent transparent;
        }
        body {
            min-height: max(884px, 100dvh);
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: none !important;
        }
        select::-ms-expand {
            display: none;
        }.material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }</style>
<style>
